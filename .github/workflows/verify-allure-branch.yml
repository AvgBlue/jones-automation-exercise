name: Verify Allure implementation on feature branch

on:
  push:
    branches: [feat/allure-pages]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify TypeScript and retention
        run: |
          pnpm run typecheck
          pnpm run test:retention
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run live Playwright test
        run: pnpm test
      - name: Generate report and inspect its output
        run: |
          pnpm run report:generate
          echo 'Allure output files:'
          find allure-report -maxdepth 4 -type f | head -60
          test -f allure-report/awesome/index.html
